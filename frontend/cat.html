<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рыжик</title>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="cat" aria-label="Рыжий кот: клик — команды, перетаскивание — перенести, двойной клик — вернуться к поиску файлов"></canvas>
    <div class="cat-menu" id="catMenu" role="menu" hidden>
      <button type="button" role="menuitemradio" data-cat="sit" aria-pressed="false">Сидеть</button>
      <button type="button" role="menuitemradio" data-cat="play" aria-pressed="false">Играть</button>
      <button type="button" role="menuitemradio" data-cat="walk" aria-pressed="false">Гулять</button>
    </div>
  </div>
  <script type="module" src="./src/cat.ts"></script>
</body>
</html>
