<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск файлов</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 1.5h5.2L13 5.3V13a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13V3a1.5 1.5 0 0 1 1-1.5Z" fill="currentColor"/><path d="M9.2 1.5V4a1.3 1.3 0 0 0 1.3 1.3H13" fill="rgba(255,255,255,.45)"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.75 4.25A1.5 1.5 0 0 1 3.25 2.75h3l1.5 1.5h5a1.5 1.5 0 0 1 1.5 1.5v6.5a1.5 1.5 0 0 1-1.5 1.5h-9.5a1.5 1.5 0 0 1-1.5-1.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-panel" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 3v10" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="m4.5 9.5 3.5-3.5 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 16 16"><rect x="2.5" y="1.75" width="11" height="12.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="i-compose" viewBox="0 0 16 16"><path d="M8.5 2.5H4A1.5 1.5 0 0 0 2.5 4v8A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V7.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="m12.3 1.9 1.8 1.8-5.6 5.6-2.3.5.5-2.3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.75 4.25h10.5M6.25 4V2.75h3.5V4M4 4.25l.6 8.6a1.3 1.3 0 0 0 1.3 1.2h4.2a1.3 1.3 0 0 0 1.3-1.2l.6-8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-board" viewBox="0 0 16 16"><rect x="1.75" y="2.25" width="5" height="4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9.25" y="9.75" width="5" height="4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.75 4.25c3 0 2.5 7.5 2.5 7.5" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2.75 6V2.75H6M10 2.75h3.25V6M13.25 10v3.25H10M6 13.25H2.75V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar">
      <nav class="places" aria-label="Папки">
        <h2 class="side-title">Папки</h2>
        <button class="side-item side-pick" id="pick" type="button">
          <svg class="side-icon"><use href="#i-plus"/></svg><span>Выбрать папку…</span>
        </button>
        <ul class="recent" id="recent"></ul>
      </nav>

      <footer class="updates">
        <p class="version" id="version"></p>
        <div class="update-row">
          <button class="update-btn" id="update" type="button">Обновить</button>
          <span class="update-dot" id="updateDot" hidden title="Есть новая версия"></span>
        </div>
        <p class="update-note" id="updateNote" role="status"></p>
      </footer>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="searchfield">
          <svg class="searchfield-icon"><use href="#i-search"/></svg>
          <input id="query" type="search" placeholder="Имя файла или его часть" autocomplete="off" spellcheck="false" aria-label="Что искать">
          <div class="mode-switch" role="radiogroup" aria-label="Где искать">
            <button type="button" role="radio" data-mode="name" aria-checked="true" title="Искать в именах файлов">Имя</button>
            <button type="button" role="radio" data-mode="text" aria-checked="false" title="Искать слова внутри документов (Ctrl+Shift+F)">Текст</button>
          </div>
          <button class="scope" id="scope" type="button" title="Папка для поиска">
            <svg><use href="#i-folder"/></svg><span id="scopeName">Выберите папку</span>
          </button>
        </div>
        <button class="tool-btn" id="openNotes" type="button" title="Заметки и холст (Ctrl+J)">
          <svg><use href="#i-note"/></svg>
        </button>
        <button class="tool-btn" id="toggleInspector" type="button" title="Предпросмотр (пробел)" aria-pressed="false">
          <svg><use href="#i-panel"/></svg>
        </button>
      </header>

      <div class="results">
        <div class="list-head" id="listHead" role="row">
          <button type="button" data-key="name" class="col col-name">Имя</button>
          <button type="button" data-key="mod" class="col col-mod">Изменён</button>
          <button type="button" data-key="size" class="col col-size">Размер</button>
          <button type="button" data-key="kind" class="col col-kind">Тип</button>
          <button type="button" data-key="dir" class="col col-dir">Папка</button>
        </div>
        <div class="list" id="list" tabindex="0" role="listbox" aria-label="Найденные файлы">
          <div class="list-spacer" id="spacer"></div>
        </div>
        <div class="empty" id="empty"></div>
      </div>

      <footer class="statusbar">
        <span class="spinner" id="spinner" hidden></span>
        <span id="status" role="status"></span>
        <span class="status-warn" id="statusWarn"></span>
        <button class="link-btn" id="stop" type="button" hidden>Остановить</button>
      </footer>
    </main>

    <section class="inspector" id="inspector" aria-label="Предпросмотр" hidden>
      <div class="inspector-resizer" id="inspectorResizer" role="separator" aria-orientation="vertical" aria-label="Ширина предпросмотра" title="Потяните, чтобы изменить ширину. Двойной щелчок — по умолчанию"></div>
      <div class="inspector-body" id="inspectorBody"></div>
    </section>
  </div>

  <button class="drawer-tab" id="drawerTab" type="button" title="Заметки (Ctrl+J)" aria-label="Открыть заметки"></button>
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <section class="drawer" id="drawer" aria-label="Заметки" aria-hidden="true" inert>
    <header class="drawer-head">
      <div class="segmented drawer-modes" role="tablist">
        <button class="segment" type="button" role="tab" data-pane="notes" aria-selected="true"><svg><use href="#i-note"/></svg>Заметки</button>
        <button class="segment" type="button" role="tab" data-pane="board" aria-selected="false"><svg><use href="#i-board"/></svg>Холст</button>
      </div>
      <button class="tool-btn drawer-close" id="drawerClose" type="button" title="Закрыть (Esc)"><svg><use href="#i-up"/></svg></button>
    </header>

    <div class="drawer-pane notes" id="notesPane">
      <aside class="notes-side">
        <div class="notes-side-head">
          <label class="notes-search"><svg><use href="#i-search"/></svg><input id="notesSearch" type="search" placeholder="Поиск" spellcheck="false"></label>
          <button class="tool-btn notes-new" id="notesNew" type="button" title="Новая заметка"><svg><use href="#i-compose"/></svg></button>
        </div>
        <ul class="notes-list" id="notesList" role="listbox" aria-label="Заметки"></ul>
      </aside>
      <article class="note-editor" id="noteEditor">
        <div class="note-toolbar">
          <time class="note-date" id="noteDate"></time>
          <button class="tool-btn" id="noteDelete" type="button" title="Удалить заметку"><svg><use href="#i-trash"/></svg></button>
        </div>
        <div class="note-text" id="noteText" contenteditable="plaintext-only" spellcheck="true" data-placeholder="Новая заметка"></div>
      </article>
    </div>

    <div class="drawer-pane board" id="boardPane" hidden>
      <div class="board-viewport" id="boardViewport" tabindex="-1">
        <div class="board-world" id="boardWorld">
          <svg class="board-links" id="boardLinks"></svg>
        </div>
        <p class="board-hint" id="boardHint">Дважды щёлкните по полю, чтобы создать карточку.<br>Тяните за кружок справа, чтобы связать карточки.</p>
      </div>
      <div class="board-colors" id="boardColors" hidden></div>
      <div class="board-zoom">
        <button class="tool-btn" type="button" id="boardAdd" title="Новая карточка"><svg><use href="#i-plus"/></svg></button>
        <span class="board-zoom-sep"></span>
        <button class="tool-btn" type="button" id="boardZoomOut" title="Уменьшить"><svg><use href="#i-minus"/></svg></button>
        <button class="board-zoom-value" type="button" id="boardZoomValue" title="Масштаб 100%">100%</button>
        <button class="tool-btn" type="button" id="boardZoomIn" title="Увеличить"><svg><use href="#i-plus"/></svg></button>
        <button class="tool-btn" type="button" id="boardFit" title="Показать всё"><svg><use href="#i-fit"/></svg></button>
      </div>
    </div>
    <div class="drawer-grip" id="drawerGrip" title="Потяните вверх, чтобы закрыть"></div>
  </section>

  <dialog class="sheet" id="updateSheet">
    <form method="dialog" class="sheet-body">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <p class="sheet-text" id="sheetText"></p>
      <p class="sheet-notes" id="sheetNotes"></p>
      <div class="sheet-progress" id="sheetProgress" hidden><div class="sheet-bar" id="sheetBar"></div></div>
      <p class="sheet-error" id="sheetError" role="alert"></p>
      <div class="sheet-actions">
        <button class="btn" value="cancel" id="sheetCancel">Позже</button>
        <button class="btn btn-primary" type="button" id="sheetConfirm">Обновить и перезапустить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="alert" hidden><span id="toastText"></span><button class="link-btn toast-action" id="toastAction" type="button" hidden></button></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
